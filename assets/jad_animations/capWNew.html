<script>
(function(){
  const states = [
    { 
      zcap: 100.0, ztap: 50.0, dV: 0.00, 
      label: "NORMAL OPERATION", 
      diffText: "NO DIFF.", lcdStatus: "SYSTEM OK",
      shortP: 0, openP: 0, tapP: 0, trip: false 
    },
    { 
      zcap: 83.3,  ztap: 50.0, dV: -1.35, 
      label: "CAP BANK CAN SHORT", 
      diffText: "NEG. DIFF.", lcdStatus: "IMBALANCE",
      shortP: 1, openP: 0, tapP: 0, trip: true 
    },
    { 
      zcap: 121.5, ztap: 50.0, dV: 2.10, 
      label: "CAP BANK CAN OPEN", 
      diffText: "POS. DIFF.", lcdStatus: "IMBALANCE",
      shortP: 0, openP: 1, tapP: 0, trip: true 
    },
    { 
      zcap: 100.0, ztap: 0.0, dV: 2.85, 
      label: "TAP-CAP SHORT", 
      diffText: "POS. DIFF.", lcdStatus: "BRIDGE FLT",
      shortP: 0, openP: 0, tapP: 1, trip: true 
    }
  ];
  const HOLD = 3200, TRANS = 1400, SEG = HOLD + TRANS, CYCLE = 4 * SEG;

  function easeInOut(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }
  function lerp(a,b,t){ return a + (b-a)*t; }

  // Resistors & Labels
  const zcapText = document.getElementById('zcapText');
  const ztapText = document.getElementById('ztapText');
  const zcapZigzag = document.getElementById('zcapZigzag');
  const ztapZigzag = document.getElementById('ztapZigzag');
  
  // Status Bar
  const phaseLabel = document.getElementById('phaseLabel');
  const statusLED = document.getElementById('statusLED');

  // SEL-487V LCD & LEDs
  const lcdVolt = document.getElementById('lcdVolt');
  const lcdDiff = document.getElementById('lcdDiff');
  const lcdStatus = document.getElementById('lcdStatus');
  const lcdUpArrow = document.getElementById('lcdUpArrow');
  const lcdDnArrow = document.getElementById('lcdDnArrow');
  const ledEnabled = document.getElementById('ledEnabled');
  const ledTrip = document.getElementById('ledTrip');
  
  // Relay Config Matrix LEDs
  const led87A = document.getElementById('led87A');
  const led87B = document.getElementById('led87B');
  const led87C = document.getElementById('led87C');
  const ledAnomal = document.getElementById('ledAnomal');

  function colorLerp(c1, c2, t){
    const r = Math.round(lerp(c1[0], c2[0], t));
    const g = Math.round(lerp(c1[1], c2[1], t));
    const b = Math.round(lerp(c1[2], c2[2], t));
    return `rgb(${r},${g},${b})`;
  }

  const NORMAL_COLOR = [0, 0, 0];       // Starts black in normal
  const FAULT_RED    = [255, 51, 51];   // Bright red for shorts
  const FAULT_PURPLE = [201, 44, 245];  // Bright purple for opens
  
  const GREEN  = [76, 255, 110];
  const RED    = [255, 51, 51];
  const PURPLE = [217, 70, 239];

  // Define target zigzag colors per state to guarantee perfect transitioning
  const stateZigzagColors = [
    { cap: NORMAL_COLOR, tap: NORMAL_COLOR }, // State 0: Normal
    { cap: FAULT_RED,    tap: NORMAL_COLOR }, // State 1: Cap Short (Red)
    { cap: FAULT_PURPLE, tap: NORMAL_COLOR }, // State 2: Cap Open (Purple)
    { cap: NORMAL_COLOR, tap: FAULT_RED }     // State 3: Tap Short (Red)
  ];

  // Hex configuration converted perfectly to RGB targets
  const ENABLE_ACTIVE_FILL    = [34, 197, 94];   // #22c55e
  const ENABLE_ACTIVE_STROKE  = [21, 128, 61];   // #15803d
  const ENABLE_INACTIVE_FILL  = [21, 128, 61];   // #15803d
  const ENABLE_INACTIVE_STROKE= [10, 60, 25];    // Dark green edge

  const TRIP_INACTIVE_FILL    = [127, 29, 29];   // #7f1d1d
  const TRIP_INACTIVE_STROKE  = [69, 10, 10];    // #450a0a
  const TRIP_ACTIVE_FILL      = [239, 68, 68];   // Active warning red
  const TRIP_ACTIVE_STROKE    = [248, 113, 113];  // Bright active red border

  // Other dynamic LED metrics
  const LED_OFF_FILL          = [69, 10, 10];
  const LED_OFF_STROKE        = [37, 3, 3];
  const YELLOW_ON_FILL        = [245, 201, 5];
  const YELLOW_ON_STROKE      = [255, 230, 100];

  let startTime = performance.now();

  function frame(now){
    const t = (now - startTime) % CYCLE;
    const segIndex = Math.floor(t / SEG);
    const segT = t - segIndex * SEG;
    const curr = states[segIndex];
    const next = states[(segIndex + 1) % 4];

    let p = 0;
    if (segT >= HOLD) {
      p = easeInOut((segT - HOLD) / TRANS);
    }

    const zcap = lerp(curr.zcap, next.zcap, p);
    const ztap = lerp(curr.ztap, next.ztap, p);
    const dV = lerp(curr.dV, next.dV, p);
    
    const shortP = lerp(curr.shortP, next.shortP, p);
    const openP = lerp(curr.openP, next.openP, p);
    const tapP = lerp(curr.tapP, next.tapP, p);
    const capFaultP = Math.max(shortP, openP);

    // Update resistor values
    zcapText.textContent = zcap.toFixed(1) + ' Ω';
    ztapText.textContent = ztap.toFixed(1) + ' Ω';

    // Interpolate target schematic colors perfectly between steps
    const currColors = stateZigzagColors[segIndex];
    const nextColors = stateZigzagColors[(segIndex + 1) % 4];

    const activeCapColor = colorLerp(currColors.cap, nextColors.cap, p);
    const activeTapColor = colorLerp(currColors.tap, nextColors.tap, p);

    zcapZigzag.setAttribute('stroke', activeCapColor);
    zcapZigzag.setAttribute('stroke-width', 4 + capFaultP * 2);

    ztapZigzag.setAttribute('stroke', activeTapColor);
    ztapZigzag.setAttribute('stroke-width', 4 + tapP * 2);

    // Update dynamic LCD elements
    lcdVolt.textContent = (dV >= 0 ? '+' : '') + dV.toFixed(2) + ' V';
    
    // Smooth LCD status / state swapping
    if (segT < HOLD) {
      lcdDiff.textContent = curr.diffText;
      lcdStatus.textContent = curr.lcdStatus;
      phaseLabel.textContent = curr.label;
      phaseLabel.style.opacity = 1;
      
      // Select appropriate status color (Normal -> Green, Short -> Red, Open -> Purple)
      let currColor = GREEN;
      if (curr.shortP > 0 || curr.tapP > 0) currColor = RED;
      else if (curr.openP > 0) currColor = PURPLE;

      phaseLabel.setAttribute('fill', `rgb(${currColor[0]},${currColor[1]},${currColor[2]})`);
      statusLED.setAttribute('fill', `rgb(${currColor[0]},${currColor[1]},${currColor[2]})`);
    } else {
      const tp = (segT - HOLD) / TRANS;
      lcdDiff.textContent = tp < 0.5 ? curr.diffText : next.diffText;
      lcdStatus.textContent = tp < 0.5 ? curr.lcdStatus : next.lcdStatus;
      phaseLabel.textContent = tp < 0.5 ? curr.label : next.label;
      phaseLabel.style.opacity = (1 - Math.sin(Math.min(tp,1) * Math.PI) * 0.85).toFixed(2);
      
      // Blend label and status LED colors smoothly during transitions
      let currColor = GREEN;
      if (curr.shortP > 0 || curr.tapP > 0) currColor = RED;
      else if (curr.openP > 0) currColor = PURPLE;

      let nextColor = GREEN;
      if (next.shortP > 0 || next.tapP > 0) nextColor = RED;
      else if (next.openP > 0) nextColor = PURPLE;

      let labelColor = colorLerp(currColor, nextColor, tp);
      phaseLabel.setAttribute('fill', labelColor);
      statusLED.setAttribute('fill', labelColor);
    }

    // Handle Up/Down Screen Arrow Highlighting
    if (dV > 0.1) {
      lcdUpArrow.setAttribute('opacity', '0.9');
      lcdDnArrow.setAttribute('opacity', '0.10');
    } else if (dV < -0.1) {
      lcdUpArrow.setAttribute('opacity', '0.10');
      lcdDnArrow.setAttribute('opacity', '0.9');
    } else {
      lcdUpArrow.setAttribute('opacity', '0.10');
      lcdDnArrow.setAttribute('opacity', '0.10');
    }

    // Handle Hardware Relay Status LEDs (Fill & Stroke Transition Dynamically)
    const tripP = lerp(curr.trip ? 1 : 0, next.trip ? 1 : 0, p);
    
    // Trip LED (Turns vibrant on Trip, fades back to user's exact dark #7f1d1d and #450a0a)
    ledTrip.setAttribute('fill', colorLerp(LED_OFF_FILL, TRIP_ACTIVE_FILL, tripP));
    ledTrip.setAttribute('stroke', colorLerp(LED_OFF_STROKE, TRIP_ACTIVE_FILL, tripP));

    // Enabled LED (Active is user's exact bright green #22c55e and #15803d, dims during Trip events)
    ledEnabled.setAttribute('fill', colorLerp(ENABLE_ACTIVE_FILL, ENABLE_INACTIVE_STROKE, tripP));
    ledEnabled.setAttribute('stroke', colorLerp(ENABLE_ACTIVE_STROKE, ENABLE_INACTIVE_STROKE, tripP));

    // Hardware Configuration Matrix LEDs triggers
    led87A.setAttribute('fill', colorLerp(LED_OFF_FILL, TRIP_ACTIVE_FILL, shortP));
    led87A.setAttribute('stroke', colorLerp(LED_OFF_STROKE, TRIP_ACTIVE_STROKE, shortP));

    led87B.setAttribute('fill', colorLerp(LED_OFF_FILL, TRIP_ACTIVE_FILL, openP));
    led87B.setAttribute('stroke', colorLerp(LED_OFF_STROKE, TRIP_ACTIVE_STROKE, openP));

    led87C.setAttribute('fill', colorLerp(LED_OFF_FILL, TRIP_ACTIVE_FILL, tapP));
    led87C.setAttribute('stroke', colorLerp(LED_OFF_STROKE, TRIP_ACTIVE_STROKE, tapP));

    ledAnomal.setAttribute('fill', colorLerp(LED_OFF_FILL, YELLOW_ON_FILL, tripP));
    ledAnomal.setAttribute('stroke', colorLerp(LED_OFF_STROKE, YELLOW_ON_STROKE, tripP));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
